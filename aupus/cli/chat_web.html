<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aupus Chat</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preload" href="/fonts/newsreader-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-sans-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Two typefaces, bundled with Aupus (SIL Open Font License): Newsreader, a serif, for the name and
     the headings only; Instrument Sans for everything else, including what Aupus writes. */
  @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 200 800; font-display: swap;
               src: url("/fonts/newsreader-latin-standard-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-style: normal; font-weight: 400 700; font-display: swap;
               src: url("/fonts/instrument-sans-latin-standard-normal.woff2") format("woff2"); }

  /* Paper and ink, with Aupus blue (the colour of its owl) as the one accent. */
  :root {
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg: #f7f6f2; --surface: #ffffff; --user: #ebe8df; --hover: #efede6;
    --text: #1d1c22; --muted: #74726b; --faint: #a9a69d; --border: #e2dfd6;
    --ink: #1d1c22; --on-ink: #f7f6f2; --brand: #14308c; --on-brand: #ffffff; --focus: #3b5bdb; --danger: #b4321f;
    --shadow: 0 1px 2px rgba(29, 28, 34, .04), 0 6px 24px rgba(29, 28, 34, .05);
  }
  :root[data-theme="dark"] {
    --bg: #1b1b1f; --surface: #242429; --user: #2f2f35; --hover: #2a2a30;
    --text: #ecebe6; --muted: #a3a19a; --faint: #6f6d67; --border: #36363d;
    --ink: #ecebe6; --on-ink: #1b1b1f; --brand: #8eaaf5; --on-brand: #0f1530; --focus: #8eaaf5; --danger: #f08a6f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b1f; --surface: #242429; --user: #2f2f35; --hover: #2a2a30;
      --text: #ecebe6; --muted: #a3a19a; --faint: #6f6d67; --border: #36363d;
      --ink: #ecebe6; --on-ink: #1b1b1f; --brand: #8eaaf5; --on-brand: #0f1530; --focus: #8eaaf5; --danger: #f08a6f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .icon { width: 18px; height: 18px; flex: none; }
  .mark { color: var(--brand); flex: none; }

  /* ---------------------------------------------------------------- header */
  header { display: flex; align-items: center; gap: 6px; padding: 12px 16px; }
  .brand { display: flex; align-items: center; gap: 9px; font: 450 23px/1 var(--serif); letter-spacing: -.2px; margin-right: auto; padding-left: 4px; }
  .brand .mark { height: 30px; width: 22.4px; margin-top: -3px; }
  #model { font-size: 12.5px; color: var(--faint); margin-right: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* The model picker: a quiet pill until it's needed; the chevron follows the theme's text colour. */
  .model-pick { position: relative; display: flex; flex: 0 1 auto; min-width: 0; color: var(--muted); margin-right: 4px; }
  .model-pick::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; pointer-events: none;
    border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-70%) rotate(45deg); }
  .model-pick:hover:not(.disabled) { color: var(--text); }
  .model-pick.disabled::after { opacity: .4; }
  #modelSelect { appearance: none; -webkit-appearance: none; font: 500 13px/1.2 var(--sans); color: inherit; background: transparent;
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 30px 8px 12px; width: 100%; max-width: 360px; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #modelSelect:hover:not(:disabled) { background: var(--hover); }
  #modelSelect:disabled { cursor: default; opacity: .6; }
  #modelSelect option { background: var(--surface); color: var(--text); }
  .icon-btn { width: 36px; height: 36px; border-radius: 9px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .icon-btn:disabled { opacity: .3; cursor: default; }

  /* ---------------------------------------------------------------- empty state: everything centred */
  main { flex: 1; overflow-y: auto; }
  .column { max-width: 740px; margin: 0 auto; padding: 0 20px; }
  #hero { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-bottom: 12vh; }
  #hero .hero-owl { display: block; height: 76px; width: 56.8px; margin: 0 auto 18px; color: var(--brand); }
  #hero h1 { font: 380 42px/1.15 var(--serif); letter-spacing: -.6px; text-align: center; margin: 0 0 10px; }
  #hero .sub { text-align: center; color: var(--muted); margin: 0 0 30px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .chip { border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .chip:hover { color: var(--brand); border-color: var(--brand); background: transparent; }
  body.chatting #hero { display: none; }
  body:not(.chatting) #log { display: none; }

  /* ---------------------------------------------------------------- conversation */
  #log { padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 22px; }
  .banner { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
  .msg { animation: appear .2s ease both; }
  .msg.user { align-self: flex-end; max-width: 82%; background: var(--user); border-radius: 18px; padding: 9px 15px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; }
  .msg.assistant { display: grid; grid-template-columns: 26px 1fr; column-gap: 12px; }
  .msg.assistant .mark { height: 24px; width: 18px; margin-top: 1px; color: var(--brand); justify-self: center; }
  .msg.assistant .text { font: 400 16px/1.7 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .msg.assistant .text.thinking { font-style: italic; color: var(--muted); animation: breathe 1.6s ease-in-out infinite; }
  .actions { grid-column: 2; display: flex; gap: 2px; margin: 6px 0 0 -8px; }
  .actions button { border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 12.5px; display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 7px; }
  .actions button:hover { color: var(--text); background: var(--hover); }
  .actions .icon { width: 14px; height: 14px; }
  .note { align-self: center; color: var(--faint); font-size: 12.5px; text-align: center; max-width: 90%; }
  .note.error { color: var(--danger); }

  /* ---------------------------------------------------------------- composer */
  #dock { padding: 8px 20px 14px; }
  body:not(.chatting) #dock { display: none; }
  #composer { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 12px 10px 18px; }
  #composer:focus-within { border-color: var(--faint); }
  textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: 16px/1.5 var(--sans); padding: 4px 0 8px; max-height: 220px; }
  textarea::placeholder { color: var(--faint); }
  #composer textarea:focus-visible { outline: none; }
  .composer-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .composer-row .hint { font-size: 12px; color: var(--faint); margin-right: auto; }
  #sendBtn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; cursor: pointer; flex: none; }
  #sendBtn:disabled { opacity: .25; cursor: default; }
  .disclaimer { text-align: center; font-size: 12px; color: var(--faint); margin-top: 9px; }

  /* ---------------------------------------------------------------- settings drawer */
  #scrim { position: fixed; inset: 0; background: rgba(20, 20, 24, .35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(370px, 92vw); background: var(--bg); border-left: 1px solid var(--border);
    padding: 22px 24px; transform: translateX(105%); transition: transform .22s ease; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 0; font: 420 25px/1.2 var(--serif); display: flex; align-items: center; justify-content: space-between; }
  #drawer label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); }
  #drawer label span { display: flex; justify-content: space-between; color: var(--text); }
  #drawer label b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #drawer small { color: var(--faint); font-size: 12px; line-height: 1.45; }
  #drawer input[type=range] { accent-color: var(--brand); width: 100%; }
  #drawer textarea { border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; background: var(--surface); min-height: 72px; font-size: 14px; }
  .reset { align-self: flex-start; border: 1px solid var(--border); background: transparent; border-radius: 9px; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
  .reset:hover { color: var(--text); background: var(--hover); }

  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 600px) {
    header { padding: 10px 10px; } #model { display: none; } .brand { flex: none; } .column { padding: 0 14px; } #log { padding: 14px 14px 24px; }
    #hero h1 { font-size: 33px; } #dock { padding: 6px 12px 10px; } .composer-row .hint { display: none; }
    .msg.assistant { grid-template-columns: 1fr; } .msg.assistant .mark { display: none; } .actions { grid-column: 1; }
  }
</style>
</head>

  <symbol id="i-save" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 20h14"/></g></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<header>
  <div class="brand"><svg class="mark" aria-hidden="true"><use href="#owl"/></svg>aupus</div>
  <div class="model-pick disabled" id="modelPick" title="Which trained version of Aupus answers">
    <select id="modelSelect" aria-label="Model" disabled><option>connecting…</option></select>
  </div>
  <div id="model"></div>
  <button id="newBtn" class="icon-btn" type="button" title="New chat" aria-label="New chat"><svg class="icon"><use href="#i-new"/></svg></button>
  <button id="saveBtn" class="icon-btn" type="button" disabled title="Save this chat to data/chats/, to correct by hand and train on" aria-label="Save chat"><svg class="icon"><use href="#i-save"/></svg></button>
  <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false"><svg class="icon"><use href="#i-sliders"/></svg></button>
  <button id="themeBtn" class="icon-btn" type="button" title="Light / dark" aria-label="Switch between light and dark"><svg class="icon"><use href="#i-moon"/></svg></button>
</header>

<main id="main">
  <section id="hero" class="column">
    <svg class="hero-owl" aria-hidden="true"><use href="#owl-large"/></svg>
    <h1>What shall we learn today?</h1>
    <p class="sub">Aupus 0.1 is a small language model, built from scratch and still learning.</p>
    <div id="heroSlot"></div>
    <div class="chips" id="chips"></div>
  </section>
  <div class="column"><div id="banner" class="banner" hidden></div></div>
  <div id="log" class="column" aria-live="polite"></div>
</main>

<footer id="dock"><div class="column" id="dockSlot"></div></footer>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Ask Aupus anything" autocomplete="off" aria-label="Message"></textarea>
  <div class="composer-row">
    <span class="hint">Enter to send · Shift+Enter for a new line</span>
    <button id="sendBtn" type="submit" aria-label="Send" title="Send"><svg class="icon"><use href="#i-send"/></svg></button>
  </div>
</form>
<p class="disclaimer" id="disclaimer">Aupus is small and can be wrong. Check anything that matters.</p>

<div id="scrim"></div>
<aside id="drawer" aria-label="Settings" aria-hidden="true">
  <h2>Settings <button id="closeBtn" class="icon-btn" type="button" aria-label="Close settings"><svg class="icon"><use href="#i-close"/></svg></button></h2>
  <label>System message
    <textarea id="system" rows="3" placeholder="Optional, e.g. Answer in one or two sentences."></textarea>
  </label>
  <label><span>Temperature <b id="temperatureVal"></b></span><input id="temperature" type="range" min="0" max="1.5" step="0.05">
    <small>Lower is more focused and predictable; higher is more varied, and more often wrong. 0 always picks the likeliest word.</small></label>
  <label><span>Reply length <b id="max_new_tokensVal"></b></span><input id="max_new_tokens" type="range" min="16" max="512" step="16">
    <small>The most tokens a reply may use (a token is about ¾ of a word).</small></label>
  <label><span>Top-p <b id="top_pVal"></b></span><input id="top_p" type="range" min="0.5" max="1" step="0.01">
    <small>Only the likeliest words that together reach this probability can be picked.</small></label>
  <label><span>Repetition penalty <b id="repetition_penaltyVal"></b></span><input id="repetition_penalty" type="range" min="1" max="1.5" step="0.01">
    <small>Makes words it has already used less likely. Small models easily repeat themselves.</small></label>
  <button id="resetBtn" class="reset" type="button">Reset to defaults</button>
</aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SLIDERS = ["temperature", "max_new_tokens", "top_p", "repetition_penalty"];
const SUGGESTIONS = ["What is a prime number?", "Why is the sky blue?", "Give me three tips for learning to read.", "Explain the water cycle simply."];
const state = { messages: [], busy: false, switching: false, controller: null, info: null };

const store = {  // per-browser convenience only; the page works without it
  get(key) { try { return JSON.parse(localStorage.getItem("aupus." + key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem("aupus." + key, JSON.stringify(value)); } catch {} },
};

function svgUse(id, cls) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", cls);
  svg.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#" + id);
  svg.appendChild(use);
  return svg;
}
const icon = (name) => svgUse("i-" + name, "icon");

// ---------------------------------------------------------------- theme
function currentTheme() {
  return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme;
  $("themeBtn").replaceChildren(icon(currentTheme() === "dark" ? "sun" : "moon"));
}
$("themeBtn").addEventListener("click", () => { const next = currentTheme() === "dark" ? "light" : "dark"; applyTheme(next); store.set("theme", next); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(store.get("theme")));
applyTheme(store.get("theme"));

// ---------------------------------------------------------------- layout: composer centred until the first message
function setChatting(on) {
  document.body.classList.toggle("chatting", on);
  const slot = on ? $("dockSlot") : $("heroSlot");
  if ($("composer").parentElement !== slot) slot.append($("composer"), $("disclaimer"));
}

// ---------------------------------------------------------------- messages
function scrollDown() { const m = $("main"); m.scrollTop = m.scrollHeight; }
function addUser(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.textContent = text;  // always text, never HTML
  $("log").appendChild(div);
  scrollDown();
  return div;
}
function addAssistant(text) {
  const row = document.createElement("div");
  row.className = "msg assistant";
  const body = document.createElement("div");
  body.className = "text";
  body.textContent = text;  // model output is inserted as text only: it can't inject markup
  const actions = document.createElement("div");
  actions.className = "actions";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.append(icon("copy"), "Copy");
  copy.addEventListener("click", async () => {
    let label = "Copied";
    try { await navigator.clipboard.writeText(body.textContent); copy.replaceChildren(icon("check"), label); }
    catch { label = "Couldn't copy"; copy.replaceChildren(icon("copy"), label); }
    setTimeout(() => copy.replaceChildren(icon("copy"), "Copy"), 1500);
  });
  actions.appendChild(copy);
  row.append(svgUse("owl", "mark"), body, actions);
  $("log").appendChild(row);
  scrollDown();
  return { row, body, actions };
}
function addNote(text, isError) {
  const div = document.createElement("div");
  div.className = "note" + (isError ? " error" : "");
  div.textContent = text;
  $("log").appendChild(div);
  scrollDown();
}
function renderAll() {
  $("log").replaceChildren();
  for (const m of state.messages) (m.role === "user" ? addUser : addAssistant)(m.content);
  setChatting(state.messages.length > 0);
  updateButtons();
}
function updateButtons() {
  const last = state.messages[state.messages.length - 1];
  $("saveBtn").disabled = state.busy || !last || last.role !== "assistant";
  $("newBtn").disabled = state.busy || state.messages.length === 0;
  $("sendBtn").replaceChildren(icon(state.busy ? "stop" : "send"));
  $("sendBtn").setAttribute("aria-label", state.busy ? "Stop" : "Send");
  $("sendBtn").title = state.busy ? "Stop" : "Send";
  $("sendBtn").disabled = state.switching || (!state.busy && !$("input").value.trim());
  const lockPicker = state.busy || state.switching || !state.info || state.info.models.length < 2;
  $("modelSelect").disabled = lockPicker;
  $("modelPick").classList.toggle("disabled", lockPicker);
}

// ---------------------------------------------------------------- talking to the server
function settings() { const out = {}; for (const k of SLIDERS) out[k] = Number($(k).value); return out; }
function conversation() {
  const system = $("system").value.trim();
  return [...(system ? [{ role: "system", content: system }] : []), ...state.messages];
}
function persist() { store.set("messages", state.messages); store.set("settings", { ...settings(), system: $("system").value }); }

async function send(text) {
  setChatting(true);
  state.messages.push({ role: "user", content: text });
  const userDiv = addUser(text);
  const { row, body, actions } = addAssistant("Thinking…");
  body.classList.add("thinking"); actions.hidden = true;
  state.busy = true; updateButtons();
  state.controller = new AbortController();
  let reply = null, stopped = false, failed = false, started = false;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversation(), settings: settings() }),
      signal: state.controller.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const line = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "token") {
          if (!started) { started = true; body.classList.remove("thinking"); body.textContent = ""; }
          body.textContent += ev.text; scrollDown();
        } else if (ev.type === "dropped") addNote(`The ${ev.count} oldest messages no longer fit in Aupus's ~1,000-token memory and were left out.`);
        else if (ev.type === "done") reply = ev.reply;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") stopped = true;
    else {
      // Nothing was answered: take the question back so it can be edited and sent again.
      failed = true;
      row.remove(); userDiv.remove(); state.messages.pop();
      addNote("Something went wrong: " + e.message, true);
      $("input").value = text; autosize();
    }
  } finally {
    body.classList.remove("thinking");
    state.busy = false; state.controller = null;
  }
  if (!failed) {
    if (!started) body.textContent = "";
    if (reply === null) reply = body.textContent.trim();
    if (!reply) body.textContent = stopped ? "…" : "(no reply)";
    if (stopped) addNote("Stopped");
    actions.hidden = false;
    state.messages.push({ role: "assistant", content: reply });
  }
  if (state.messages.length === 0) setChatting(false);
  updateButtons(); persist(); $("input").focus();
}

// ---------------------------------------------------------------- composer and buttons
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; updateButtons(); }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (state.busy) { state.controller?.abort(); return; }
  if (state.switching) return;
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; autosize();
  send(text);
});
$("newBtn").addEventListener("click", () => { state.messages = []; renderAll(); persist(); $("input").focus(); });
$("saveBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: conversation() }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    addNote("Saved to " + data.path + ". Correct the replies by hand before training on it.");
  } catch (e) { addNote("Couldn't save: " + e.message, true); }
});
for (const text of SUGGESTIONS) {
  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "chip"; chip.textContent = text;
  chip.addEventListener("click", () => { if (!state.busy && !state.switching) send(text); });
  $("chips").appendChild(chip);
}

// ---------------------------------------------------------------- settings drawer
function drawer(open) {
  $("drawer").classList.toggle("open", open); $("scrim").classList.toggle("open", open);
  $("drawer").setAttribute("aria-hidden", String(!open)); $("settingsBtn").setAttribute("aria-expanded", String(open));
  if (open) $("temperature").focus();
}
$("settingsBtn").addEventListener("click", () => drawer(!$("drawer").classList.contains("open")));
$("closeBtn").addEventListener("click", () => drawer(false));
$("scrim").addEventListener("click", () => drawer(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") drawer(false); });
function setSliders(values) { for (const k of SLIDERS) { $(k).value = values[k]; $(k + "Val").textContent = $(k).value; } }
for (const k of SLIDERS) $(k).addEventListener("input", () => { $(k + "Val").textContent = $(k).value; persist(); });
$("system").addEventListener("change", persist);
$("resetBtn").addEventListener("click", () => { setSliders(state.info.defaults); $("system").value = ""; persist(); });

// ---------------------------------------------------------------- model picker
function modelLabel(m) { return m.label + (m.val_loss != null ? " · val " + m.val_loss.toFixed(3) : ""); }
function renderInfo(i) {
  $("modelSelect").replaceChildren(...i.models.map((m) => {
    const option = document.createElement("option");
    option.value = m.id; option.textContent = modelLabel(m);  // text only, like everything else
    return option;
  }));
  $("modelSelect").value = i.model;
  $("modelPick").title = "Which trained version of Aupus answers: " + i.source;
  $("model").textContent = `${i.params_m}M · ${i.stage === "sft" ? "chat" : "base"} · ${i.device}`;
  $("model").title = i.source;
  $("banner").hidden = i.stage !== "pretrain";
  $("banner").textContent = "This is a Base model: it learned to continue web text, not to chat, so expect it to ramble.";
  updateButtons();
}
$("modelSelect").addEventListener("change", async () => {
  const id = $("modelSelect").value;
  const chosen = state.info.models.find((m) => m.id === id);
  state.switching = true; $("model").textContent = "loading…"; updateButtons();
  try {
    const res = await fetch("/api/model", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: id }) });
    const data = await res.json().catch(() => ({ error: res.statusText }));
    if (!res.ok) throw new Error(data.error || res.statusText);
    state.info = data;
    if (state.messages.length) addNote("Replies from here on come from " + modelLabel(chosen) + ".");
  } catch (e) {
    state.switching = false;
    renderInfo(state.info);  // back to the model that is still loaded
    const text = "Couldn't switch the model: " + e.message;
    if (state.messages.length) addNote(text, true);
    else { $("banner").hidden = false; $("banner").textContent = text; }
    return;
  } finally { state.switching = false; }
  renderInfo(state.info); $("input").focus();
});

// ---------------------------------------------------------------- start
(async function init() {
  setChatting(false);
  try {
    state.info = await (await fetch("/api/info")).json();
  } catch { $("modelSelect").replaceChildren(new Option("server not reachable")); return; }
  const i = state.info;
  renderInfo(i);
  const saved = store.get("settings") || {};
  setSliders(Object.fromEntries(SLIDERS.map((k) => [k, saved[k] ?? i.defaults[k]])));
  $("system").value = saved.system || "";
  state.messages = Array.isArray(store.get("messages")) ? store.get("messages") : [];
  renderAll(); $("input").focus();
})();
</script>
</body>
</html>
