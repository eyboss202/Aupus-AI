# Pretraining data settings for Aupus 0.1 (FineWeb-Edu). See docs/DATA.md for what each rule does.
# Every key is optional (the defaults in aupus/data/config.py are these values); typos fail loudly.
filters:
  min_words: 50
  max_words: 100000
  min_mean_word_length: 3.0
  max_mean_word_length: 10.0
  max_symbol_to_word_ratio: 0.1
  max_ellipsis_line_fraction: 0.3
  max_bullet_line_fraction: 0.9
  min_alpha_word_fraction: 0.8
  min_stop_words: 2
  max_duplicate_line_fraction: 0.3
  max_replacement_char_fraction: 0.001
dedup:
  num_perm: 128
  bands: 16
  ngram: 5
  seed: 1234
val_fraction: 0.005
shard_tokens: 100000000
