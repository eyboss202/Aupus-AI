# Milestone 10: Vulpes 0.1 Instruct = Vulpes 0.1 Base fine-tuned on ~20K human-written conversations
# (oasst2 English top-1 branches + Dolly 15k + data/identity.jsonl), loss on replies only (docs/PLAN.md §4).
# Sized on the GTX 1650 Super (4 GiB) with the dry run on the pilot checkpoint (docs/PLAN.md §19):
# `small` needs ~2 GiB for weights + gradients + AdamW alone, and the 32k-token output layer costs
# ~0.5 GiB per copy for 4 x 1,024 positions, so micro-batch 4 peaks at ~3.6 GiB and doesn't fit.
# Micro-batch 1 peaks at 2.3 GiB, needs no padding and ran at ~1,190 tok/s in the dry run: ~6.4 s
# per step (7,600 tokens), ~70 min per epoch with evaluations (~1 min each), ~3.5 h for 3 epochs
# (less with early stopping).
run_name: vulpes-0.1-instruct
init_from: runs/vulpes-0.1-base/best.pt
data_dir: data/sft
micro_batch: 1
grad_accum: 32         # 32 conversations per optimizer step, ~600 steps per epoch
epochs: 3              # an upper bound: early stopping usually ends the run sooner
patience: 3            # stop after 3 evaluations (300 steps) without a better val loss
optim:
  lr: 3.0e-5           # ~1/20 of pretraining's peak: adjust the model, don't overwrite it
  min_lr: 3.0e-6
  warmup_steps: 50
  weight_decay: 0.1
precision: auto        # fp32 on the GTX 1650 Super (docs/PLAN.md decision 13)
compile: true
grad_checkpointing: true
cuda_memory_limit_gib: 2.9  # a clear error instead of a silent spill into system RAM (§19)
eval_every: 100
save_every: 200
keep_last: 2
log_every: 10
sample_every: 200
sample_tokens: 128
sample_prompts:
  - "What is a prime number?"
  - "Who are you?"
  - "Give me three tips for learning to read."
  - "Why is the sky blue?"
